name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check-pr-target:
    name: Check PR Target Branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate target branch is dev
        run: |
          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error title=Invalid PR Target::Pull requests must target the 'dev' branch. Direct contributions to 'main' are not permitted. Please change the base branch of this PR to 'dev'."
            exit 1
          fi
          echo "Target branch '${{ github.base_ref }}' is valid."

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm generate
      - run: git diff --exit-code
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @openvenue/web exec playwright install --with-deps chromium
      - run: pnpm --filter @openvenue/web e2e

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: python manage.py check
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECRET_KEY: ci-only-secret
      - run: python manage.py test
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECRET_KEY: ci-only-secret
