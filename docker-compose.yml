name: openvenue

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openvenue
      POSTGRES_USER: openvenue
      POSTGRES_PASSWORD: openvenue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvenue -d openvenue"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: dev-only-change-me
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: openvenue
      POSTGRES_USER: openvenue
      POSTGRES_PASSWORD: openvenue
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"

volumes:
  pgdata:
